<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Placeholder Image Builder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="header">
          <div>
            <h1 id="app-title">Placeholder Image Builder</h1>
            <p>Generate 1920 x 1080 PNG files from two CSV files.</p>
          </div>
          <button id="generateButton" type="button" disabled>Generate PNGs</button>
        </div>

        <div class="controls">
          <label class="field">
            <span>File 1 CSV</span>
            <input id="fileOneInput" type="file" accept=".csv,text/csv" />
          </label>

          <label class="field">
            <span>File 2 CSV</span>
            <input id="fileTwoInput" type="file" accept=".csv,text/csv" />
          </label>

          <label class="field">
            <span>Background color</span>
            <input id="backgroundColorInput" type="color" value="#f3f4f6" />
          </label>

          <label class="field">
            <span>Text color</span>
            <input id="textColorInput" type="color" value="#111827" />
          </label>
        </div>

        <div class="preview-wrap">
          <canvas id="previewCanvas" width="1920" height="1080" aria-label="Image preview"></canvas>
        </div>

        <div class="status-panel">
          <div id="statusText">Choose both CSV files to begin.</div>
          <progress id="progressBar" value="0" max="1" hidden></progress>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
